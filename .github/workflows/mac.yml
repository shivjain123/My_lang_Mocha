name: Mac check

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Evil number 5 (should say EVIL)
        run: echo 5 | bash ./mocha execute evil.mch
      - name: Evil number 7 (should say NOT Evil)
        run: echo 7 | bash ./mocha execute evil.mch
      - name: Build all libraries except ds
        run: bash ./mocha libs
      - name: Use a library (stopwatch test)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute stopwatch_T.mch
      - name: Native code test (Lua FFI)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute lua_ffi.mch
      - name: Native code test (SQLite FFI)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute sqlite3_ffi.mch
      - name: Native code test (Wren)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute wren_test.mch
      - name: Native code test (Zig FFI)
        if: always()
        timeout-minutes: 10
        run: bash ./mocha execute zig_test.mch