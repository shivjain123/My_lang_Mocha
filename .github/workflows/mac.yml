name: Mac check

on:
  push:
    paths:
      - 'mocha'
      - 'mocha_*.py'
      - 'mocha_runtime.c'
      - 'hello_cpp.cpp'
      - 'cpp_tests.mch'
      - 'lib/**'
      - 'run_all.sh'
      - 'test_*.mch'
      - '.github/workflows/mac.yml'
  workflow_dispatch:

concurrency:
  group: mac-check
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests (run_all.sh)
        timeout-minutes: 40
        run: bash ./run_all.sh
      - name: Native code test (C++ FFI)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute cpp_tests.mch

  basics:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Evil number 5 (should say EVIL)
        run: echo 5 | bash ./mocha execute evil.mch
      - name: Evil number 7 (should say NOT Evil)
        run: echo 7 | bash ./mocha execute evil.mch
      - name: Build all libraries
        run: bash ./mocha libs
      - name: Use a library (stopwatch test)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute stopwatch_T.mch
      - name: Native code test (Lua FFI)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute lua_ffi.mch
      - name: Native code test (SQLite FFI)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute sqlite3_ffi.mch
      - name: Native code test (Wren)
        if: always()
        timeout-minutes: 5
        run: bash ./mocha execute wren_test.mch
      - name: Native code test (Zig FFI)
        if: always()
        timeout-minutes: 10
        run: bash ./mocha execute zig_test.mch
      - name: WebAssembly build (cape_demo)
        if: always()
        timeout-minutes: 10
        run: |
          bash ./mocha wasm cape_demo.mch cape_demo
          ls -l cape_demo.wasm cape_demo.js cape_demo.html
      - name: Run the WebAssembly (cape_demo)
        if: always()
        timeout-minutes: 5
        run: |
          cp cape_demo.js cape_demo_node.mjs
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { load } from './cape_demo_node.mjs';
          const realFetch = globalThis.fetch;
          globalThis.fetch = async (u, ...rest) =>