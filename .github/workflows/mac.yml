name: Mac check

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Evil number 5 (should say EVIL)
        run: echo 5 | bash ./mocha execute evil.mch
      - name: Evil number 7 (should say NOT Evil)
        run: echo 7 | bash ./mocha execute evil.mch
      - name: Build all libraries except ds
        run: bash ./mocha libs astro bio chem forge geo ink lua math matvec meteoro neuron processing society space sqlite stats stopwatch string SymCha wren